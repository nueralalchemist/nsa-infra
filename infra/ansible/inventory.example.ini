# Copy to inventory.ini (git-ignored) and edit.

[nsa_servers]
# A remote cloud box:
cloud1 ansible_host=203.0.113.10 ansible_user=ubuntu
# ...or run the playbook on the box itself:
# cloud1 ansible_connection=local

[nsa_clients]
# Your WSL / Linux / macOS workstation (installs the nsa CLI from this repo):
workstation ansible_connection=local

[nsa_servers:vars]
ansible_python_interpreter=/usr/bin/python3
