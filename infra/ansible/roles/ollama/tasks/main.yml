---
- name: Check for an existing Ollama install
  ansible.builtin.stat:
    path: /usr/local/bin/ollama
  register: ollama_bin

- name: Install Ollama
  when: not ollama_bin.stat.exists
  block:
    - name: Warn when the installer checksum is not pinned
      ansible.builtin.debug:
        msg: "nsa_ollama_install_sha256 is empty: the installer is downloaded unverified. Pin it once reviewed."
      when: nsa_ollama_install_sha256 | length == 0

    - name: Download the installer
      ansible.builtin.get_url:
        url: https://ollama.com/install.sh
        dest: /var/tmp/nsa-ollama-install.sh
        mode: "0700"
        checksum: "{{ ('sha256:' ~ nsa_ollama_install_sha256) if nsa_ollama_install_sha256 | length > 0 else omit }}"
        force: true

    - name: Run the installer
      ansible.builtin.command: sh /var/tmp/nsa-ollama-install.sh
      args:
        creates: /usr/local/bin/ollama
  always:
    - name: Remove the installer
      ansible.builtin.file:
        path: /var/tmp/nsa-ollama-install.sh
        state: absent

- name: Check for the Ollama backend directory (after the install step)
  ansible.builtin.stat:
    path: /usr/local/lib/ollama
  register: ollama_libdir

- name: Make the Ollama backends readable by the service user
  # A restrictive umask during install leaves the CUDA dir 0700 root-only; Ollama then silently runs on CPU.
  ansible.builtin.file:
    path: /usr/local/lib/ollama
    state: directory
    recurse: true
    mode: "u=rwX,g=rX,o=rX"
  when: ollama_libdir.stat.exists

- name: Create the Ollama drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Ollama (localhost only, one model, one request at a time)
  ansible.builtin.template:
    src: ollama-override.conf.j2
    dest: /etc/systemd/system/ollama.service.d/nsa.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart ollama

- name: Flush handlers so Ollama picks up its config before pulling
  ansible.builtin.meta: flush_handlers

- name: Enable and start Ollama
  ansible.builtin.systemd:
    name: ollama
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the Ollama API
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/tags
  register: ollama_api
  until: ollama_api.status == 200
  retries: 30
  delay: 2
  check_mode: false

- name: List installed models
  ansible.builtin.command: ollama list
  register: ollama_list
  changed_when: false
  check_mode: false

- name: Pull missing models
  ansible.builtin.command: "ollama pull {{ item | quote }}"
  loop: "{{ nsa_models }}"
  when: item not in (ollama_list.stdout_lines[1:] | map('split') | map('first') | list)
  async: 3600
  poll: 15
  changed_when: true
